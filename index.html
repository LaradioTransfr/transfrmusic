<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TRANSFR MUSIC</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: #1ed760;
            color: #000;
        }
        .logo { font-size: 24px; font-weight: bold; }
        .btn {
            background-color: #000;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .container { padding: 20px; }
        .section {
            background-color: #242424;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }
        .music-grid {
            display: flex;
            gap: 20px;
        }
        .music-card {
            background-color: #181818;
            padding: 15px;
            border-radius: 8px;
            width: 150px;
            text-align: center;
        }
        input, select, button {
            margin: 5px 0;
            padding: 10px;
            border-radius: 5px;
            border: none;
            width: 100%;
            box-sizing: border-box;
        }
        button.action-btn { background-color: #1ed760; color: #000; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="logo">♪ TRANSFR MUSIC</div>
    <div>
        <button class="btn" id="loginBtn">Se connecter</button>
        <button class="btn" id="registerBtn">Créer un compte</button>
    </div>
</header>

<div class="container">

    <div class="section">
        <h2>Les Titres Disponibles</h2>
        <div class="music-grid">
            <div class="music-card">
                <p>Chill Day</p>
                <button class="action-btn">Écouter</button>
            </div>
            <div class="music-card">
                <p>Higher</p>
                <button class="action-btn">Écouter</button>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>Espace Créateur Premium</h2>
        <p>Envoyer un fichier audio MP3</p>
        <input type="text" placeholder="Titre de la chanson">
        <input type="text" placeholder="Ton nom d'artiste">
        <input type="file" accept=".mp3">
        <button class="action-btn">Envoyer la musique</button>
    </div>

    <div class="section" id="adminSection" style="display:none;">
        <h2>Serveur de validation du Directeur</h2>
        <p>Aucune musique en attente de validation...</p>
    </div>

</div>

<script>
    document.getElementById('registerBtn').addEventListener('click', function() {
        alert("Formulaire d'inscription à implémenter ici.");
    });
    
    document.getElementById('loginBtn').addEventListener('click', function() {
        let code = prompt("Entrez le code secret Directeur (pour tester l'admin) :");
        if (code === "1944") {
            document.getElementById('adminSection').style.display = 'block';
            alert("Accès Administrateur autorisé.");
        } else {
            alert("Code invalide.");
        }
    });
</script>

</body>
</html>
