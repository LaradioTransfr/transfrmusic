<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANSFR MUSIC - Accueil</title>
    <style>
        :root {
            --primary-color: #1ed760;
            --bg-dark: #121212;
            --bg-section: #242424;
            --text-color: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: var(--primary-color);
            color: #000000;
        }
        .logo { font-size: 24px; font-weight: bold; }
        .nav-buttons { display: flex; gap: 10px; align-items: center; }
        .btn {
            background-color: #000000;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
        }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .section {
            background-color: var(--bg-section);
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
        }
        footer { text-align: center; margin-top: 40px; font-size: 14px; }
        footer a { color: var(--primary-color); text-decoration: none; }
    </style>
</head>
<body>

<header>
    <div class="logo">♪ TRANSFR MUSIC</div>
    <div class="nav-buttons">
        <a href="musique.html" class="btn" style="background-color: white; color: black;">📻 Aller aux Musiques</a>
    </div>
</header>

<div class="container">
    <div class="section">
        <h2>Bienvenue sur TRANSFR MUSIC !</h2>
        <p>L'application officielle de la radio est en cours de préparation pour le store Aptoide.</p>
    </div>
</div>

<footer>
    <a href="confidentialite.html">Politique de Confidentialité</a>
</footer>

</body>
</html>
