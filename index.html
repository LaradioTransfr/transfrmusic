<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANSFR MUSIC - Les Titres</title>
    <style>
        :root {
            --primary-color: #1ed760;
            --bg-dark: #121212;
            --bg-card: #181818;
            --bg-section: #242424;
            --text-color: #ffffff;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-dark); color: var(--text-color);
            margin: 0; padding: 0;
        }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px; background-color: var(--primary-color); color: #000;
        }
        .logo { font-size: 24px; font-weight: bold; }
        .btn {
            background-color: #000; color: #fff; padding: 10px 20px;
            border: none; border-radius: 20px; cursor: pointer; font-weight: bold; text-decoration: none;
        }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .section { background-color: var(--bg-section); padding: 25px; margin-bottom: 25px; border-radius: 12px; }
        h2 { border-bottom: 2px solid var(--primary-color); padding-bottom: 8px; margin-top: 0; }
        
        .music-grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 15px; }
        .music-card {
            background-color: var(--bg-card); padding: 15px; border-radius: 8px;
            width: 240px; text-align: center; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .music-card p { margin: 5px 0; font-weight: bold; }
        .music-card .artist { font-size: 14px; color: #b3b3b3; margin-bottom: 10px; }
        audio { width: 100%; border-radius: 4px; }
        
        input, textarea {
            width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px;
            border: 1px solid #444; background-color: #333; color: white; box-sizing: border-box;
        }
        .submit-btn {
            background-color: var(--primary-color); color: #000; font-weight: bold;
            cursor: pointer; border: none; padding: 12px; border-radius: 6px; width: 100%;
        }
        .server-log {
            background-color: #000; color: #00ff00; font-family: monospace;
            padding: 10px; border-radius: 6px; max-height: 100px; overflow-y: auto; font-size: 13px;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">♪ TRANSFR MUSIC - Titres</div>
    <div>
        <span id="userStatusLabel" style="font-weight: bold; margin-right: 15px;"></span>
        <a href="index.html" class="btn">🏠 Retour à l'Accueil</a>
    </div>
</header>

<div class="container">

    <div class="section" id="creatorSection" style="display: none;">
        <h2>🌟 Publier sur le Serveur Mondial TRANSFR</h2>
        <p>En tant que membre Premium, ta musique sera envoyée en ligne et écoutable par tout le monde !</p>
        <form id="uploadForm">
            <input type="text" id="musicTitle" placeholder="Titre de la chanson" required>
            <input type="text" id="musicArtist" placeholder="Ton nom d'artiste" required>
            <textarea id="musicContext" placeholder="Paroles ou style de musique" required></textarea>
            <input type="text" id="musicUrl" placeholder="Lien URL de ton fichier .mp3" required>
            <button type="submit" class="submit-btn">Envoyer à la Base de Données Globale</button>
        </form>
    </div>

    <div class="section">
        <h2>🎵 Titres du Nuage TRANSFR MUSIC</h2>
        <div class="music-log server-log" id="statusLog">[Système] Connexion au nuage en cours...</div>
        <div class="music-grid" id="musicGrid"></div>
    </div>

</div>

<script>
    const SUPABASE_URL = "METS_TON_URL_SUPABASE_ICI"; 
    const SUPABASE_KEY = "METS_TA_CLE_ANON_SUPABASE_ICI";

    const insultesGraves = ["fils de pute", "connard", "salope", "pute", "merde"];
    const musicGrid = document.getElementById('musicGrid');
    const statusLog = document.getElementById('statusLog');
    const creatorSection = document.getElementById('creatorSection');
    const userStatusLabel = document.getElementById('userStatusLabel');

    let currentUser = JSON.parse(localStorage.getItem('session_user')) || null;

    if (currentUser) {
        userStatusLabel.textContent = currentUser.username + (currentUser.isPremium ? " ⭐" : " (Normal)");
        if (currentUser.isPremium) creatorSection.style.display = 'block';
    } else {
        userStatusLabel.textContent = "Visiteur déconnecté";
    }

    function logStatus(msg) { statusLog.textContent = `[Nuage] ${msg}`; }

    async function chargerMusiquesMondiales() {
        if (SUPABASE_URL.includes("METS_TON_URL")) {
            logStatus("Serveur en mode local. Connecte ton Supabase pour partager avec d'autres appareils !");
            return;
        }
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/musiques?select=*`, {
                headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
            });
            const musiques = await response.json();
            musicGrid.innerHTML = `
                <div class="music-card">
                    <p>Chill Day</p><div class="artist">LAKEY INSPIRED</div>
                    <audio controls src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
                </div>
            `;
            musiques.forEach(m => {
                const card = document.createElement('div');
                card.className = 'music-card';
                card.innerHTML = `<p>${m.titre}</p><div class="artist">${m.artiste}</div><audio controls src="${m.url_audio}"></audio>`;
                musicGrid.appendChild(card);
            });
            logStatus("Musiques mondiales synchronisées avec succès !");
        } catch (error) {
            logStatus("Erreur de connexion au cloud.");
        }
    }

    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const titre = document.getElementById('musicTitle').value;
        const artiste = document.getElementById('musicArtist').value;
        const url_audio = document.getElementById('musicUrl').value;
        const context = document.getElementById('musicContext').value.toLowerCase();

        let texteComplet = (titre + " " + artiste).toLowerCase();
        let grosMot = insultesGraves.some(word => texteComplet.includes(word) || context.includes(word));
        let pourLeRythme = context.includes("rythme") || context.includes("rap");

        if (grosMot && !pourLeRythme) { alert("Refusé par la modération !"); return; }
        if (SUPABASE_URL.includes("METS_TON_URL")) { alert("Configure ton Supabase !"); return; }

        logStatus("Envoi du morceau vers internet...");
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/musiques`, {
                method: 'POST',
                headers: {
                    "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`,
                    "Content-Type": "application/json", "Prefer": "return=minimal"
                },
                body: JSON.stringify({ titre, artiste, url_audio })
            });
            if (response.ok) {
                alert("Parfait ! Ta musique est en ligne !");
                this.reset(); chargerMusiquesMondiales();
            }
        } catch (error) { alert("Erreur lors de l'envoi."); }
    });

    chargerMusiquesMondiales();
</script>
</body>
</html>
